[workspace]
members = [".", "fuzz"]
exclude = ["fuzz"]
resolver = "3"

[workspace.dependencies]
# Unicode 18.0.0, supplied by the experimental ICU4X main overrides below.
icu_casemap = { version = ">=2.3.0, <2.4.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = ">=2.3.0, <2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = ">=2.3.0, <2.4.0", default-features = false, features = ["compiled_data"] }

# Only the fuzzer uses this directly. A tighter upper bound would hold back both
# icu_locale_core and icu_provider across the workspace, so tests and fuzzing
# would exercise older infrastructure versions than downstream users can resolve.
icu_locale_core = { version = "2.3.0", default-features = false }

[package]
name = "normalized-path"
version = "0.2.1"
description = "Opinionated cross-platform, optionally case-insensitive path normalization"
repository = "https://github.com/ngg/normalized-path"
documentation = "https://docs.rs/normalized-path"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "README.md"

[package.metadata.docs.rs]
features = ["std"]

[badges]
maintenance = { status = "experimental" }

[features]
default = ["std"]
std = []
__test = []

[dependencies]
icu_casemap = { workspace = true }
icu_normalizer = { workspace = true }
icu_properties = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = { version = "0.3.0", default-features = false, features = ["CFString"] }

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dev-dependencies]
wasm-bindgen-test = "0.3.0"

# Experimental Unicode 18.0.0 support from ICU4X main (requires Rust 1.88+).
[patch.crates-io]
icu_casemap = { git = "https://github.com/unicode-org/icu4x", branch = "main" }
icu_normalizer = { git = "https://github.com/unicode-org/icu4x", branch = "main" }
icu_properties = { git = "https://github.com/unicode-org/icu4x", branch = "main" }
icu_locale_core = { git = "https://github.com/unicode-org/icu4x", branch = "main" }
