name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.85"
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: macos-arm
            runner: macos-latest
          - name: macos-intel
            runner: macos-26-intel
          - name: windows
            runner: windows-latest
          - name: msrv
            runner: ubuntu-latest
            msrv: true
          - name: minimal-versions
            runner: ubuntu-latest
            toolchain: nightly
            minimal_versions: true
          - name: android
            runner: ubuntu-latest
            target: aarch64-linux-android
            skip_tests: true
          - name: ios
            runner: macos-latest
            target: aarch64-apple-ios
            skip_tests: true
          - name: wasm32-unknown-unknown
            runner: ubuntu-latest
            target: wasm32-unknown-unknown
          - name: wasm32-wasip1
            runner: ubuntu-latest
            target: wasm32-wasip1
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARG: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      MINIMAL_VERSIONS_ARG: ${{ matrix.minimal_versions && '-Z minimal-versions' || '' }}
      IGNORE_RUST_VERSION_ARG: ${{ matrix.msrv != true && '--ignore-rust-version' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.msrv && env.MSRV || matrix.toolchain || 'stable' }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          key: ${{ matrix.name }}
      - run: cargo update ${{ env.MINIMAL_VERSIONS_ARG }} ${{ env.IGNORE_RUST_VERSION_ARG }}
      - if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          VERSION=$(cargo pkgid wasm-bindgen | cut -d"@" -f2)
          INSTALLED=$(wasm-bindgen --version 2>/dev/null | cut -d" " -f2 || echo "")
          if [ "$VERSION" != "$INSTALLED" ]; then
            cargo install -f wasm-bindgen-cli --version "$VERSION"
          fi
      - if: matrix.target == 'wasm32-wasip1'
        run: cargo install wasmtime-cli
      - run: cargo build ${{ env.TARGET_ARG }}
      - run: cargo build ${{ env.TARGET_ARG }} --no-default-features
      - if: matrix.skip_tests != true
        run: cargo test ${{ env.TARGET_ARG }}
      - if: matrix.skip_tests != true
        run: cargo test ${{ env.TARGET_ARG }} --no-default-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo update --ignore-rust-version
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo update --ignore-rust-version
      - run: cargo fmt --all --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - run: cargo install cargo-docs-rs
      - run: cargo update --ignore-rust-version
      - run: cargo docs-rs

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            fork: 3
          - runner: macos-26-intel
            fork: 4
          - runner: windows-latest
            fork: 4
          - runner: ubuntu-latest
            fork: 4
    uses: ./.github/workflows/fuzz.yml
    with:
      runs-on: ${{ matrix.runner }}
      fork: ${{ matrix.fork }}
