name: Nightly fuzz

on:
  schedule:
    - cron: "21 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            fork: 3
          - name: macos-intel
            runner: macos-26-intel
            fork: 4
          - name: windows
            runner: windows-latest
            fork: 4
          - name: linux
            runner: ubuntu-latest
            fork: 4
    uses: ./.github/workflows/fuzz.yml
    with:
      runs-on: ${{ matrix.runner }}
      timeout: 600
      fork: ${{ matrix.fork }}
